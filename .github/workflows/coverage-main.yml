name: Coverage (main)

# The single CodeScene publisher. CodeScene accepts `cs-coverage upload`
# only for analysed branches, so main's coverage is uploaded here on
# push. Pull requests generate coverage with the ratchet this workflow
# advances, and nothing a pull request runs receives CodeScene
# credentials or contacts CodeScene.
# tests/test_codescene_coverage_contract.py holds the shape.
#
# workflow_dispatch stays because merges made by the automerge workflow's
# GITHUB_TOKEN do not fire push-event workflows. A dispatch can aim at any
# branch, which is why the upload step is guarded on the ref as well as
# the token.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run per ref at a time, never cancelled. GitHub keeps one
# pending run per group, so a newer push replaces an older pending run
# and never interrupts a running one; the newest baseline wins. A
# cancelled run would abandon both its upload and its ratchet baseline
# write. The group is keyed on the ref so that a dispatch from another
# branch cannot displace a pending main run and then skip the upload.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: ./repo_local_tools
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        # The token binds here and nowhere else in the workflow.
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          # No checksum input: the action pins the CLI through its own
          # manifest, and `installer-checksum` is rejected from this pin.
