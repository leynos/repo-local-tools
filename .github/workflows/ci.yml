name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Check spelling
        run: make spelling

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.1 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts

      # Coverage runs on pull requests only, ratcheting against the
      # baseline coverage-main.yml writes on pushes to main; that workflow
      # is also the only one that uploads to CodeScene. Nothing here
      # publishes the report. The source scope keeps the package set the
      # earlier Slipcover step measured.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@774cc5a01e457714aede66e14a97b3e257812fc2
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: ./repo_local_tools
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'
